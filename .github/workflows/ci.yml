name: CI

# Backlog B9.1 -- every phase of this project has been verified with real
# pytest runs and live curl sequences each session, but none of that ran
# automatically for anyone else who clones the repo. This workflow is the
# missing piece: it runs the already-committed backend test suite
# (backend/tests/, self-contained -- conftest.py points every DB/secrets
# path at a throwaway temp location, no real network or Ollama/Tavily key
# required) and a frontend production build on every push/PR, so a broken
# clone is caught before a real user hits it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Matches backend/Dockerfile's python:3.12-slim base -- CI should
      # validate the same interpreter version the shipped image actually
      # runs, not whatever happens to be on the runner by default.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Audit P3 -- lint runs BEFORE the tests. A run that fails on an
      # undefined name should say so in one line, not bury it in a
      # traceback from whichever test happened to import that module
      # first.
      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run backend test suite
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build
