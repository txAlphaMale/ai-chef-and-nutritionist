<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef</title>
    <!-- Backlog B7.3 -- PWA installability. theme_color/background_color
         are static here (and in manifest.webmanifest) since a web app
         manifest can't read this app's own dynamic --color-primary CSS
         variable (see themes.js) -- both are set to this app's DEFAULT
         theme's colors as a reasonable fixed choice, same simplification
         documented in PROJECT-PLAN.md's B7.3 notes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c1440e" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chef" />
  </head>
  <body>
    <!-- Theme pre-hydration (2026-08-01): applies the last-known theme
         from localStorage synchronously, before React (or even the CSS
         file) has loaded, so the page never flashes the default theme
         before switching to whatever was actually selected. The real
         source of truth is the DB-backed "ui_theme" setting (see
         src/themes.js / SettingsPage.jsx) -- this is only a same-tab
         instant-apply cache reconciled against that setting once the
         app mounts. Must run before <div id="root"> paints anything,
         so it's inline and un-deferred, not a module import. */ -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("chefTheme");
          if (theme && theme !== "default") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {
          // ignore -- falls back to the default theme
        }
      })();
    </script>
    <div id="root"></div>
    <!-- Runtime config, written by docker-entrypoint.sh at container start
         from the BACKEND_PORT env var -- see src/api.js. Only exists in
         the production Docker build; harmless 404 in `npm run dev` (dev
         mode doesn't need it, see api.js). Must load before the app
         bundle below. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
