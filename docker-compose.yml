# Chef -- AI meal planning, inventory, and recipe management
#
# ONE service. The app serves its own frontend (app/static_files.py), so
# there is one container, one port pair, and one TLS certificate.
#
# It used to be two: a second container ran a Node static server that
# also reverse-proxied /api back here. That existed to solve a real
# problem -- the browser previously had to reach two origins and trust
# two certificates -- but serving the built files from the API that
# already exists solves it without a second runtime, and the proxy's
# ~520 lines were where a fatal, silent crash-loop lived. Do not split
# this back apart without writing down a concrete reason.
#
# Assumes Ollama runs on the host (or elsewhere on your network) --
# point OLLAMA_BASE_URL in .env, or edit it later from the app's
# Settings page, to wherever it's reachable. To run Ollama as part of
# this stack (with NVIDIA GPU passthrough), see docker-compose.ollama.yml
# -- an opt-in override, not enabled by default:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up --build

services:
  chef:
    build:
      # Repo root: one image builds the frontend (node stage) and the
      # backend (python stage). See ./Dockerfile.
      context: .
      dockerfile: Dockerfile
    container_name: chef
    restart: unless-stopped
    env_file:
      # `required: false` so a fresh clone starts with `docker compose up
      # --build` and no manual step. Every value in .env has a working
      # default here or in settings_service's SETTING_SPECS, and the
      # runtime-configurable ones (Ollama URL/models, Tavily key) are
      # meant to be set from the Settings page anyway. Needs Docker
      # Compose v2.24 or newer for the `required` key.
      - path: .env
        required: false
    ports:
      # This is the app. Both sides of each mapping use the SAME env var
      # deliberately: run_server.py binds whatever APP_PORT/APP_HTTPS_PORT
      # say at runtime, so a customised port would otherwise be published
      # on one side and bound on the other, and silently unreachable.
      #
      # Plain HTTP. Serves the app when no certificate is installed;
      # 307-redirects to the HTTPS port once one is.
      - "${APP_PORT:-5173}:${APP_PORT:-5173}"
      # HTTPS, active once a certificate exists. Needed for more than
      # privacy: the camera (barcode scanning) and geolocation (Dining
      # Out) are gated behind a Secure Context by the browser, so they do
      # not work at all over plain HTTP.
      - "${APP_HTTPS_PORT:-5174}:${APP_HTTPS_PORT:-5174}"
    volumes:
      # SQLite database, uploaded images, knowledge files.
      - chef-data:/app/data
      # The active TLS certificate/key, self-signed or imported. Still its
      # own volume rather than a subdirectory of chef-data: it has a
      # different lifecycle (regenerated/replaced independently of the
      # data) and keeping it separate means a data restore never silently
      # swaps the certificate out too.
      - chef-tls:/app/tls
      # Optional -- batch recipe import from a folder on this host (e.g. a
      # OneDrive/Dropbox/Google Drive folder that already syncs here as a
      # normal directory). Uncomment and point the left side at your real
      # folder, then set RECIPE_IMPORT_FOLDER_PATH=/app/data/recipe_import
      # in .env (or in Settings > Integrations) to match the right side.
      # Mounted read-only -- Chef only ever reads from this folder.
      # - /path/on/this/host/to/your/recipes:/app/data/recipe_import:ro
    # Probes whichever port the app actually binds: HTTPS when a
    # certificate is present, plain HTTP otherwise. Python rather than
    # curl/wget because the slim base image ships neither, and adding a
    # package just for a healthcheck is a package for nothing.
    # Certificate verification is off because it is self-signed by design
    # and this request never leaves the container.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,ssl,sys,urllib.request; tls=os.path.isfile('/app/tls/cert.pem'); port=os.environ.get('APP_HTTPS_PORT','5174') if tls else os.environ.get('APP_PORT','5173'); scheme='https' if tls else 'http'; ctx=ssl._create_unverified_context() if tls else None; sys.exit(0 if urllib.request.urlopen(f'{scheme}://127.0.0.1:{port}/health', timeout=3, context=ctx).status==200 else 1)"
      interval: 10s
      timeout: 5s
      # Generous: the first start runs migrations and seeding before the
      # server binds, and this hardware is not fast.
      start_period: 60s
      retries: 5

volumes:
  chef-data:
    driver: local
  chef-tls:
    driver: local
