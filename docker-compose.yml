# Chef -- AI meal planning, inventory, and recipe management
#
# Assumes Ollama runs on the host (or elsewhere on your network) --
# point OLLAMA_BASE_URL in .env, or edit it later from the app's
# Settings page, to wherever it's reachable. If you'd rather run Ollama
# as part of this stack (with NVIDIA GPU passthrough), see
# docker-compose.ollama.yml -- an opt-in override, not enabled by
# default:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up --build

services:
  backend:
    build: ./backend
    container_name: chef-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Author-reported 2026-08-03: as of frontend/server.js, a browser
      # never needs to reach these directly anymore -- the frontend
      # container reverse-proxies /api/* and /health to this service over
      # Docker's own internal network (see BACKEND_INTERNAL_HOST in
      # .env.example). These host-port mappings are kept only for
      # OPTIONAL direct access -- hitting the API with curl/a script, or
      # debugging -- and can be commented out entirely for a deployment
      # that wants the backend unreachable from the LAN outside its own
      # container. Not required for normal app use on any device.
      #
      # Both sides of each mapping deliberately use the SAME env var --
      # fixed 2026-08-02 after an author-reported live bug: B15.1's new
      # run_server.py binds the container's OWN internal uvicorn listener
      # to whatever BACKEND_PORT/BACKEND_HTTPS_PORT says (see
      # backend/app/run_server.py's HTTP_PORT/HTTPS_PORT), replacing the
      # old Dockerfile CMD that always hardcoded --port 8095 regardless
      # of the env var. Before this fix, the right-hand (container-side)
      # port here was still hardcoded to the literal default (8095/8446),
      # so anyone who had customized BACKEND_PORT away from 8095 (e.g.
      # because 8095 was already taken on their host -- a real, previously
      # -fixed scenario, see the 2026-07-31 session-log entry) got a
      # container listening on their custom port with NOTHING mapped to
      # it on the host side: Docker forwarded host:<custom port> to a
      # now-empty container:8095, so every single API request failed as
      # a browser-level "Failed to fetch" with zero trace in the
      # container's own logs (the request never reached the app at all).
      # Confirmed live against the author's own docker compose logs
      # before applying this fix, not guessed.
      - "${BACKEND_PORT:-8095}:${BACKEND_PORT:-8095}"
      # Backlog B15.1 (2026-08-01) -- only actually listening once a
      # certificate is generated/imported under Settings > Security >
      # Certificate (see app/services/tls_service.py). Until then the
      # backend serves plain HTTP on BACKEND_PORT above, same as always;
      # once a cert exists, BACKEND_PORT switches to a redirect-only
      # listener and this becomes the real one. Note this is now purely
      # optional too (see above) -- the frontend proxy always talks to
      # this container over plain HTTP on the internal Docker network,
      # regardless of whether HTTPS is active here.
      - "${BACKEND_HTTPS_PORT:-8446}:${BACKEND_HTTPS_PORT:-8446}"
    volumes:
      - chef-data:/app/data
      # Backlog B15.1 -- where the backend writes the active TLS
      # certificate/key (self-signed or imported). Shared read-only with
      # the frontend container below so both can serve the SAME
      # certificate -- a browser's camera/geolocation Secure Context
      # check is about the origin the PAGE itself loaded from, not just
      # the API it calls, so the frontend needs HTTPS too, not only the
      # backend. See tls_service.py's module docstring for the full
      # architecture writeup.
      - chef-tls:/app/tls
      # Backlog B13.1 (optional) -- batch recipe import from a folder on
      # this host (e.g. a OneDrive/Dropbox/Google Drive folder that
      # already syncs here as a normal directory). Uncomment and point
      # the left side at your real folder, then set
      # RECIPE_IMPORT_FOLDER_PATH=/app/data/recipe_import in .env (or in
      # Settings > Integrations > "Recipe import folder path") to match
      # the right side below. Mounted read-only (:ro) -- Chef only ever
      # reads from this folder, never writes to or deletes from it. See
      # the in-app WIKI's "Recipe folder import" entry for the full
      # walkthrough.
      # - /path/on/this/host/to/your/recipes:/app/data/recipe_import:ro

  frontend:
    build: ./frontend
    container_name: chef-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Same host==container port-mapping fix as the backend above, and
      # for the same reason: docker-entrypoint.sh's supervisor loop binds
      # `serve` to the live FRONTEND_PORT/FRONTEND_HTTPS_PORT env vars,
      # not a hardcoded default, so both sides of each mapping need to
      # track the same variable or a customized port silently goes
      # unreachable from outside the container.
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
      # Backlog B15.1 -- see the matching backend port above; the
      # frontend independently watches the same chef-tls volume and
      # switches to serving HTTPS here once a certificate appears (see
      # frontend/docker-entrypoint.sh). Backlog B15.1 follow-up
      # (2026-08-02, author-requested): the frontend now ALSO runs a
      # plain-HTTP-to-HTTPS redirect listener on FRONTEND_PORT once HTTPS
      # is active (redirect-server.js) -- a bookmarked http://host:5173
      # link auto-redirects to https://host:5174 instead of needing a
      # manual update.
      - "${FRONTEND_HTTPS_PORT:-5174}:${FRONTEND_HTTPS_PORT:-5174}"
    volumes:
      # Backlog B15.1 -- read-only: the frontend only ever READS the
      # certificate the backend generated/imported, never writes one.
      - chef-tls:/app/tls:ro
    depends_on:
      - backend

volumes:
  chef-data:
    driver: local
  chef-tls:
    driver: local
