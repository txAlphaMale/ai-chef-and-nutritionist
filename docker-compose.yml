# Chef -- AI meal planning, inventory, and recipe management
#
# Assumes Ollama runs on the host (or elsewhere on your network) --
# point OLLAMA_BASE_URL in .env, or edit it later from the app's
# Settings page, to wherever it's reachable. If you'd rather run Ollama
# as part of this stack (with NVIDIA GPU passthrough), see
# docker-compose.ollama.yml -- an opt-in override, not enabled by
# default:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up --build

services:
  backend:
    build: ./backend
    container_name: chef-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8095}:8095"
    volumes:
      - chef-data:/app/data

  frontend:
    build: ./frontend
    container_name: chef-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  chef-data:
    driver: local
